name: Sentient Voice ID
version: "0.3.1"
slug: sentient_voice_id
description: Recognises who is speaking, and finds memories by meaning — locally — for the Sentient integration.
url: https://github.com/suncy1983-hash/sentient-hu
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
# No ports: only Home Assistant (and other apps) on the internal network can reach it.
options:
  threshold: 0.7
  margin: 0.06
  learn: true
  text_model: base
schema:
  threshold: float(0.3,0.95)
  margin: float(0,0.5)
  learn: bool
  text_model: list(base|small)
